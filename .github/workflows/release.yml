name: Release wheels

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to Release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-wheels:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Verify the tag matches version.py
        run: |
          VERSION="$(python3 -c 'exec(open("redo_lightfm/version.py").read()); print(__version__)')"
          if [ "${{ inputs.tag }}" != "$VERSION" ]; then
            echo "tag ${{ inputs.tag }} does not match version.py ${VERSION}"
            exit 1
          fi

      - name: Check whether the release already exists
        id: existing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ inputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build wheels
        if: steps.existing.outputs.exists == 'false'
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_ARCHS_LINUX: x86_64
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MUSLLINUX_X86_64_IMAGE: musllinux_1_2
          CIBW_ENVIRONMENT: LIGHTFM_MARCH=x86-64
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: >-
            cp -r {project}/tests . &&
            pytest tests/test_api.py tests/test_data.py
            tests/test_evaluation.py tests/test_fast_functions.py

      - uses: actions/upload-artifact@v7
        if: steps.existing.outputs.exists == 'false'
        with:
          name: wheels
          path: wheelhouse/*.whl

      - name: Create the release
        if: steps.existing.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            wheelhouse/*.whl
